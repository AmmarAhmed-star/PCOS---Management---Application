<!DOCTYPE html><html><head><link rel="stylesheet" href="pcos-app.css">
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CycleCare 💖 - Ammar Ahmed</title>
</head><body>
<div class='hero'><div style='font-size:52px'>💖</div><h1>CycleCare 💖</h1><p>By Ammar Ahmed | Live on GitHub Pages | Made with ❤️</p><div><span class='pill'>🔥 LIVE</span><span class='pill'>⭐ 4.8 Rating</span><span class='pill'>🚀 2026</span></div></div>
<div class='wrap'><div class='card'><h2>🌸 Your Wellness Companion</h2><p>Cycle Day <b>14</b> | Next Period <b>28 Nov 2026</b></p><input type='date' id='lp'><button onclick='calc()'>Calculate Next Period ✨</button><p id='res'></p><input id='sym' placeholder='Symptom: Cramps, Mood...'><button class='green' onclick='addSym()'>Add Symptom +</button><ul id='list'></ul><h3>Daily Habits ✅</h3><label><input type='checkbox'> 💧 8 glasses water</label><br><label><input type='checkbox'> 🚶 30 min walk</label><br><label><input type='checkbox'> 🥗 Balanced meal</label><br><label><input type='checkbox'> 😴 7-8 hrs sleep</label><p>For tracking only, not medical diagnosis.</p></div></div><script>function calc(){let d=document.getElementById('lp').value;if(!d){alert('Select date');return;}let dt=new Date(d);dt.setDate(dt.getDate()+32);document.getElementById('res').innerText='💖 Estimated Next: '+dt.toDateString();}function addSym(){let v=document.getElementById('sym').value;if(!v)return;let li=document.createElement('li');li.innerText='🌸 '+v;document.getElementById('list').appendChild(li);document.getElementById('sym').value='';}</script></body></html>
