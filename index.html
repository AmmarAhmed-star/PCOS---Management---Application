<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CycleCare PCOS App</title><style>body{font-family:Arial;max-width:800px;margin:0 auto;padding:20px;background:#f8fafc}button{background:#2563eb;color:#fff;border:0;padding:10px 14px;border-radius:8px;margin:4px;cursor:pointer}input,select,textarea{padding:10px;margin:4px;border:1px solid #ccc;border-radius:8px;width:90%}.card{background:#fff;padding:16px;border-radius:12px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}</style></head><body><h1>CycleCare - PCOS Companion</h1><div class='card'><h3>Dashboard</h3><p>Cycle Day: <b id='day'>14</b> | Next Period: <b>28 Nov 2026</b></p><label>Last Period Date <input type='date' id='lp'></label><button onclick='calc()'>Calculate Next Period</button><p id='res'></p></div><div class='card'><h3>Log Symptom</h3><input id='sym' placeholder='e.g. Cramps, Bloating, Mood'><button onclick='addSym()'>Add Symptom</button><ul id='list'></ul></div><div class='card'><h3>Daily Habits</h3><label><input type='checkbox'> Drink 8 glasses water</label><br><label><input type='checkbox'> 30 min walk</label><br><label><input type='checkbox'> Balanced meal</label><br><label><input type='checkbox'> Sleep 7-8 hrs</label><p>For tracking only, not medical diagnosis. Please consult a doctor.</p></div><script>function calc(){let d=document.getElementById('lp').value;if(!d){alert('Select date');return;}let dt=new Date(d);dt.setDate(dt.getDate()+32);document.getElementById('res').innerText='Estimated Next Period: '+dt.toDateString();}function addSym(){let v=document.getElementById('sym').value;if(!v)return;let li=document.createElement('li');li.innerText=v+' - '+new Date().toLocaleDateString();document.getElementById('list').appendChild(li);document.getElementById('sym').value='';}</script></body></html>
