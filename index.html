<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CycleCare 💖 - Ammar Ahmed</title>
<style>
*{box-sizing:border-box}body{font-family:'Segoe UI',Arial;margin:0;background:#f0f2ff}
.hero{background:linear-gradient(135deg,#ff9a9e,#fecfef,#fbc2eb);color:#fff;padding:32px 20px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.hero h1{font-size:32px;margin:0}.hero p{opacity:.9}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 20px rgba(0,0,0,.08);border-left:6px solid #ff6b6b}
button{background:linear-gradient(90deg,#ff6b6b,#ffa502);color:#fff;border:0;padding:12px 18px;border-radius:999px;margin:5px;cursor:pointer;font-weight:700;box-shadow:0 4px 12px rgba(255,107,107,.4)}
button.blue{background:linear-gradient(90deg,#4facfe,#00f2fe)}button.green{background:linear-gradient(90deg,#43e97b,#38f9d7)}button.purple{background:linear-gradient(90deg,#a18cd1,#fbc2eb);color:#333}
input,select,textarea{padding:12px;margin:5px;border:2px solid #e5e7eb;border-radius:12px;width:92%;font-size:15px}
.bar{display:inline-block;width:28px;margin:2px;border-radius:8px 8px 0 0;text-align:center;color:#fff;font-weight:700}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;background:#fff3cd;margin:3px;font-size:13px;font-weight:700}
.badge{background:#ff4757;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class='hero'><div style='font-size:52px'>💖</div><h1>CycleCare 💖</h1><p>By Ammar Ahmed | Live on GitHub Pages | Made with ❤️</p><div><span class='pill'>🔥 LIVE</span><span class='pill'>⭐ 4.8 Rating</span><span class='pill'>🚀 2026</span></div></div>
<div class='wrap'><div class='card'><h2>🌸 Your Wellness Companion</h2><p>Cycle Day <b>14</b> | Next Period <b>28 Nov 2026</b></p><input type='date' id='lp'><button onclick='calc()'>Calculate Next Period ✨</button><p id='res'></p><input id='sym' placeholder='Symptom: Cramps, Mood...'><button class='green' onclick='addSym()'>Add Symptom +</button><ul id='list'></ul><h3>Daily Habits ✅</h3><label><input type='checkbox'> 💧 8 glasses water</label><br><label><input type='checkbox'> 🚶 30 min walk</label><br><label><input type='checkbox'> 🥗 Balanced meal</label><br><label><input type='checkbox'> 😴 7-8 hrs sleep</label><p>For tracking only, not medical diagnosis.</p></div></div><script>function calc(){let d=document.getElementById('lp').value;if(!d){alert('Select date');return;}let dt=new Date(d);dt.setDate(dt.getDate()+32);document.getElementById('res').innerText='💖 Estimated Next: '+dt.toDateString();}function addSym(){let v=document.getElementById('sym').value;if(!v)return;let li=document.createElement('li');li.innerText='🌸 '+v;document.getElementById('list').appendChild(li);document.getElementById('sym').value='';}</script></body></html>
